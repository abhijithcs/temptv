<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1, user-scalable=no">
<title>Crispr Learning — Slideshow</title>
<meta name="description" content="Crispr Learning digital signage image slideshow">

<style>
/* =====================================================================
   1. CSS VARIABLES
   ===================================================================== */
:root{
  --gold:            #FEB602;
  --teal:            #006073;
  --teal-light:      #00899e;
  --bar-track:       rgba(255,255,255,0.18);

  --slide-duration:      10000ms; /* default dwell time; each slide's own `seconds` overrides it */
  --transition-duration:  1500ms; /* crossfade length between images */
  --ease-smooth: cubic-bezier(.22,1,.36,1);
}

/* =====================================================================
   2. BASE STYLES
   ===================================================================== */
*, *::before, *::after{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body{
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  -webkit-user-select: none;
  user-select: none;
  cursor: none;
  font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
}

::-webkit-scrollbar{ display: none; width: 0; height: 0; }

/* =====================================================================
   3. LAYOUT — a true 16:9 frame, centered and letterboxed to fit any
   screen. Built with vw/vh (not the newer `aspect-ratio` property,
   which older Android TV WebViews don't support and would silently
   collapse) so it is safe on effectively any browser.
   ===================================================================== */
.stage-wrap{
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

.stage{
  position: relative;
  width: 100vw;
  height: 56.25vw;      /* 100 * 9/16 */
  max-height: 100vh;
  max-width: 177.78vh;  /* 100 * 16/9 */
  background: #000;
  overflow: hidden;
}

/* =====================================================================
   4. COMPONENTS — slides, placeholder, bottom progress chrome
   ===================================================================== */
.slide{
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity var(--transition-duration) var(--ease-smooth);
  will-change: opacity;
}

.slide.is-active{
  opacity: 1;
  z-index: 2;
}

.slide img{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1);
  transition: transform 12s linear;
  will-change: transform;
}

/* gentle Ken Burns drift while an image is on screen */
.slide.is-active img{
  transform: scale(1.08);
}

/* placeholder shown when the default image itself fails to load */
.no-images{
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  color: rgba(255,255,255,0.55);
  background: linear-gradient(160deg, #0F172A, #000);
  opacity: 0;
  transition: opacity 600ms ease;
  z-index: 1;
}

.no-images.visible{ opacity: 1; }

.no-images .icon{
  width: 72px; height: 72px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
}

.no-images .icon svg{
  width: 34px; height: 34px;
  stroke: var(--gold);
}

.no-images .msg{
  font-size: 16px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.no-images .hint{
  font-size: 13px;
  font-family: monospace;
  color: rgba(255,255,255,0.35);
}

/* bottom overlay: scrim + progress bar + slide counter */
.bottom-chrome{
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 3;
  padding: 40px 36px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  background: linear-gradient(0deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.0) 100%);
}

/* author `display:flex` above would otherwise override the hidden attribute */
.bottom-chrome[hidden]{ display: none; }

.progress-bar{
  position: relative;
  flex: 1 1 auto;
  height: 6px;
  border-radius: 999px;
  background: var(--bar-track);
  overflow: hidden;
}

.progress-bar .fill{
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform: scaleX(0);
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold), var(--teal-light));
  box-shadow: 0 0 12px rgba(254,182,2,0.55);
}

.progress-bar .fill.running{
  animation: fillBar var(--slide-duration) linear forwards;
}

.progress-bar .fill.done{
  transform: scaleX(1);
}

.slide-counter{
  flex: 0 0 auto;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.75);
  font-variant-numeric: tabular-nums;
}

.slide-counter .current{
  color: var(--gold);
  font-size: 17px;
}

/* =====================================================================
   5. ANIMATIONS
   ===================================================================== */
@keyframes fillBar{
  from{ transform: scaleX(0); }
  to{ transform: scaleX(1); }
}

@media (prefers-reduced-motion: reduce){
  .slide, .slide img, .progress-bar .fill{
    transition-duration: 0.001ms !important;
    animation-duration: 0.001ms !important;
  }
  .slide.is-active img{ transform: scale(1); }
}
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <!-- slides are injected here by JS -->
    <div class="no-images" id="noImages">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5.5-5.5L9 17"></path></svg>
      </div>
      <div class="msg">No slides available</div>
      <div class="hint" id="noImagesHint">Waiting for slides from the API…</div>
    </div>

    <div class="bottom-chrome" id="bottomChrome" hidden>
      <div class="progress-bar"><span class="fill" id="progressFill"></span></div>
      <div class="slide-counter"><span class="current" id="counterCurrent">1</span> / <span id="counterTotal">1</span></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   JAVASCRIPT CONTROLLER
   Sections:
     A. API fetch + IndexedDB cache of base64 slides
     B. Slideshow build + crossfade loop (per-slide durations)
     C. Visibility handling + kiosk auto-refresh
   ===================================================================== */
(function(){
  "use strict";

  const API_URL = "https://crisprtech.app/crispr-apis/public/tv-content.php";
  const DEFAULT_SECONDS = 10;        // used when an item has no valid `seconds`
  const DEFAULT_IMAGE = "images/default.png"; // shown, untimed, when the API gives nothing
  const RETRY_INTERVAL = 15000;      // retry delay while nothing is cached/available

  const CACHE_DB = "temptv-cache";
  const CACHE_STORE = "kv";
  const CACHE_KEY = "slides";

  const stage = document.getElementById('stage');
  const noImagesEl = document.getElementById('noImages');
  const bottomChrome = document.getElementById('bottomChrome');
  const progressFill = document.getElementById('progressFill');
  const counterCurrent = document.getElementById('counterCurrent');
  const counterTotal = document.getElementById('counterTotal');

  /* ------------------------------------------------------------------
     A. API + CACHE — slides come from API_URL as
        { status, data: [{ id, title, imageData: <base64 data URI>, duration }] }. The last good response
        is kept in IndexedDB so the TV can start instantly (and offline)
        from cache while a fresh copy is fetched in the background.
        IndexedDB rather than localStorage: base64 images easily exceed
        localStorage's ~5 MB quota.
     ------------------------------------------------------------------ */
  function openDb(){
    return new Promise((resolve) => {
      try{
        const req = indexedDB.open(CACHE_DB, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(CACHE_STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      }catch(e){ resolve(null); }
    });
  }

  async function cacheGet(){
    const db = await openDb();
    if(!db) return null;
    return new Promise((resolve) => {
      try{
        const req = db.transaction(CACHE_STORE).objectStore(CACHE_STORE).get(CACHE_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      }catch(e){ resolve(null); }
    });
  }

  async function cachePut(slides){
    const db = await openDb();
    if(!db) return;
    try{
      db.transaction(CACHE_STORE, 'readwrite').objectStore(CACHE_STORE).put(slides, CACHE_KEY);
    }catch(e){ /* cache is best-effort */ }
  }

  // accepts a full data: URI, or bare base64 (mime sniffed from its header)
  function toDataUri(b64){
    if(b64.indexOf('data:') === 0) return b64;
    let mime = 'image/jpeg';
    if(b64.indexOf('iVBOR') === 0) mime = 'image/png';
    else if(b64.indexOf('UklGR') === 0) mime = 'image/webp';
    else if(b64.indexOf('R0lGOD') === 0) mime = 'image/gif';
    return `data:${mime};base64,${b64}`;
  }

  // API payload { status, data: [{ id, title, imageData, duration }] }
  // -> [{ src, seconds }], dropping malformed items. Items keep the API's
  // order (or sort by an `order` field if one is ever provided).
  function normalize(payload){
    const list = payload && Array.isArray(payload.data) ? payload.data : [];
    return list
      .map((item, index) => ({ item, index }))
      .filter(({ item }) => item && typeof item.imageData === 'string' && item.imageData)
      .sort((a, b) => ((Number(a.item.order) || 0) - (Number(b.item.order) || 0)) || (a.index - b.index))
      .map(({ item }) => ({
        src: toDataUri(item.imageData),
        seconds: Number(item.duration) > 0 ? Number(item.duration) : DEFAULT_SECONDS
      }));
  }

  async function fetchSlides(){
    const res = await fetch(API_URL, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    if(!payload || payload.status !== 'success') throw new Error('API status: ' + (payload && payload.status));
    return payload;
  }

  /* ------------------------------------------------------------------
     B. SLIDESHOW — plain crossfade, fixed dwell time, loops forever
     ------------------------------------------------------------------ */
  let slideEls = [];
  let durations = [];
  let current = 0;
  let paused = false;
  let advanceTimer = null;
  let shownSignature = null;
  let showingDefault = false;

  function buildSlides(slides){
    slideEls.forEach((el) => el.remove());
    slideEls = [];
    durations = slides.map((s) => s.seconds * 1000);

    slides.forEach((slide, i) => {
      const el = document.createElement('div');
      el.className = 'slide';
      const img = document.createElement('img');
      img.alt = `Crispr Learning slide ${i + 1}`;
      img.src = slide.src;
      // Ken Burns drift lasts as long as the slide is on screen
      img.style.transitionDuration = slide.seconds + 's';
      el.appendChild(img);
      stage.insertBefore(el, bottomChrome);
      slideEls.push(el);
    });
  }

  function setProgress(running){
    progressFill.classList.remove('running', 'done');
    progressFill.style.animationDuration = (durations[current] / 1000) + 's';
    void progressFill.offsetWidth; // restart the CSS animation cleanly
    progressFill.classList.add(running ? 'running' : 'done');
  }

  function goTo(index){
    if(showingDefault) return;
    const total = slideEls.length;
    const next = ((index % total) + total) % total;

    slideEls.forEach((el, i) => el.classList.toggle('is-active', i === next));

    current = next;
    counterCurrent.textContent = String(current + 1);
    setProgress(!paused);
    scheduleAdvance();
  }

  function scheduleAdvance(){
    clearTimeout(advanceTimer);
    if(paused) return;
    advanceTimer = setTimeout(() => goTo(current + 1), durations[current]);
  }

  function pause(){
    if(paused) return;
    paused = true;
    clearTimeout(advanceTimer);
    progressFill.style.animationPlayState = 'paused';
  }

  function resume(){
    if(!paused) return;
    paused = false;
    progressFill.style.animationPlayState = 'running';
    scheduleAdvance();
  }

  function show(slides){
    clearTimeout(advanceTimer);
    showingDefault = false;
    noImagesEl.classList.remove('visible');
    bottomChrome.hidden = false;
    counterTotal.textContent = String(slides.length);
    buildSlides(slides);
    goTo(0);
  }

  // Static fallback: one untimed image, no progress bar, no advancing.
  function showDefault(){
    if(showingDefault) return;
    clearTimeout(advanceTimer);
    showingDefault = true;
    shownSignature = null;
    bottomChrome.hidden = true;
    noImagesEl.classList.remove('visible');

    slideEls.forEach((el) => el.remove());
    durations = [];
    current = 0;

    const el = document.createElement('div');
    el.className = 'slide is-active';
    const img = document.createElement('img');
    img.alt = 'Crispr Learning';
    img.style.transition = 'none'; // no Ken Burns drift on the static image
    img.onerror = () => noImagesEl.classList.add('visible'); // default missing too
    img.src = DEFAULT_IMAGE;
    el.appendChild(img);
    stage.insertBefore(el, bottomChrome);
    slideEls = [el];
  }

  // Fetch fresh slides; re-render + re-cache only when they differ from
  // what is already on screen (e.g. the cached copy shown at boot).
  async function sync(){
    let raw = null;
    let fetched = false;
    try{
      raw = await fetchSlides();
      fetched = true;
    }catch(e){
      console.warn('Slide fetch failed:', e);
    }

    const fresh = normalize(raw);
    if(fresh.length){
      const signature = JSON.stringify(fresh);
      if(signature !== shownSignature){
        shownSignature = signature;
        cachePut(raw); // cache the raw payload; normalize() runs on read
        show(fresh);
      }
    } else {
      // API answered with no usable slides: drop the stale cache and show the
      // default. If the API just failed, keep cached slides when we have them.
      if(fetched) cachePut(raw);
      if(fetched || slideEls.length === 0) showDefault();
      setTimeout(sync, RETRY_INTERVAL);
    }
  }

  async function start(){
    const cached = normalize(await cacheGet());
    if(cached.length){
      shownSignature = JSON.stringify(cached);
      show(cached);
    }
    sync();
  }

  start();

  /* ------------------------------------------------------------------
     C. VISIBILITY HANDLING + KIOSK AUTO-REFRESH
     ------------------------------------------------------------------ */
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      clearTimeout(advanceTimer);
    } else if(!paused){
      scheduleAdvance();
    }
  });

  window.addEventListener('keydown', (e) => {
    if(slideEls.length === 0 || showingDefault) return;
    switch(e.key){
      case 'ArrowRight': goTo(current + 1); break;
      case 'ArrowLeft': goTo(current - 1); break;
      case ' ': e.preventDefault(); paused ? resume() : pause(); break;
    }
  });

  // hard-reload every 5 minutes (cache-busted) so page updates reach the TV
  // without a manual restart; slides then boot from cache and re-sync.
  const AUTO_REFRESH_INTERVAL = 5 * 60 * 1000;
  setInterval(() => {
    const url = new URL(window.location.href);
    url.searchParams.set('_r', Date.now());
    window.location.replace(url.toString());
  }, AUTO_REFRESH_INTERVAL);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1, user-scalable=no">
<title>Crispr Learning — Slideshow</title>
<meta name="description" content="Crispr Learning digital signage image slideshow">

<style>
/* =====================================================================
   1. CSS VARIABLES
   ===================================================================== */
:root{
  --gold:            #FEB602;
  --teal:            #006073;
  --teal-light:      #00899e;
  --bar-track:       rgba(255,255,255,0.18);

  --slide-duration:      10000ms; /* time each image stays on screen */
  --transition-duration:  1500ms; /* crossfade length between images */
  --ease-smooth: cubic-bezier(.22,1,.36,1);
}

/* =====================================================================
   2. BASE STYLES
   ===================================================================== */
*, *::before, *::after{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body{
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  -webkit-user-select: none;
  user-select: none;
  cursor: none;
  font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
}

::-webkit-scrollbar{ display: none; width: 0; height: 0; }

/* =====================================================================
   3. LAYOUT — a true 16:9 frame, centered and letterboxed to fit any
   screen. Built with vw/vh (not the newer `aspect-ratio` property,
   which older Android TV WebViews don't support and would silently
   collapse) so it is safe on effectively any browser.
   ===================================================================== */
.stage-wrap{
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

.stage{
  position: relative;
  width: 100vw;
  height: 56.25vw;      /* 100 * 9/16 */
  max-height: 100vh;
  max-width: 177.78vh;  /* 100 * 16/9 */
  background: #000;
  overflow: hidden;
}

/* =====================================================================
   4. COMPONENTS — slides, placeholder, bottom progress chrome
   ===================================================================== */
.slide{
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity var(--transition-duration) var(--ease-smooth);
  will-change: opacity;
}

.slide.is-active{
  opacity: 1;
  z-index: 2;
}

.slide img{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1);
  transition: transform 12s linear;
  will-change: transform;
}

/* gentle Ken Burns drift while an image is on screen */
.slide.is-active img{
  transform: scale(1.08);
}

/* placeholder shown when no images/image-N.* files are found */
.no-images{
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  color: rgba(255,255,255,0.55);
  background: linear-gradient(160deg, #0F172A, #000);
  opacity: 0;
  transition: opacity 600ms ease;
  z-index: 1;
}

.no-images.visible{ opacity: 1; }

.no-images .icon{
  width: 72px; height: 72px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
}

.no-images .icon svg{
  width: 34px; height: 34px;
  stroke: var(--gold);
}

.no-images .msg{
  font-size: 16px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.no-images .hint{
  font-size: 13px;
  font-family: monospace;
  color: rgba(255,255,255,0.35);
}

/* bottom overlay: scrim + progress bar + slide counter */
.bottom-chrome{
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 3;
  padding: 40px 36px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  background: linear-gradient(0deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.0) 100%);
}

.progress-bar{
  position: relative;
  flex: 1 1 auto;
  height: 6px;
  border-radius: 999px;
  background: var(--bar-track);
  overflow: hidden;
}

.progress-bar .fill{
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform: scaleX(0);
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold), var(--teal-light));
  box-shadow: 0 0 12px rgba(254,182,2,0.55);
}

.progress-bar .fill.running{
  animation: fillBar var(--slide-duration) linear forwards;
}

.progress-bar .fill.done{
  transform: scaleX(1);
}

.slide-counter{
  flex: 0 0 auto;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.75);
  font-variant-numeric: tabular-nums;
}

.slide-counter .current{
  color: var(--gold);
  font-size: 17px;
}

/* =====================================================================
   5. ANIMATIONS
   ===================================================================== */
@keyframes fillBar{
  from{ transform: scaleX(0); }
  to{ transform: scaleX(1); }
}

@media (prefers-reduced-motion: reduce){
  .slide, .slide img, .progress-bar .fill{
    transition-duration: 0.001ms !important;
    animation-duration: 0.001ms !important;
  }
  .slide.is-active img{ transform: scale(1); }
}
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <!-- slides are injected here by JS -->
    <div class="no-images" id="noImages">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5.5-5.5L9 17"></path></svg>
      </div>
      <div class="msg">No images found</div>
      <div class="hint" id="noImagesHint">images/image-1.jpg, image-2.jpg, …</div>
    </div>

    <div class="bottom-chrome" id="bottomChrome" hidden>
      <div class="progress-bar"><span class="fill" id="progressFill"></span></div>
      <div class="slide-counter"><span class="current" id="counterCurrent">1</span> / <span id="counterTotal">1</span></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   JAVASCRIPT CONTROLLER
   Sections:
     A. Image discovery (probes images/image-1, image-2, … automatically)
     B. Slideshow build + crossfade loop
     C. Visibility handling + kiosk auto-refresh
   ===================================================================== */
(function(){
  "use strict";

  const FOLDER = "images/";
  const NAME_PREFIX = "image-";
  const EXTENSIONS = ["jpg", "jpeg", "png", "webp"];
  const MAX_INDEX = 30; // highest image-N this will look for

  const SLIDE_DURATION = parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue('--slide-duration')) || 10000;

  const stage = document.getElementById('stage');
  const noImagesEl = document.getElementById('noImages');
  const noImagesHint = document.getElementById('noImagesHint');
  const bottomChrome = document.getElementById('bottomChrome');
  const progressFill = document.getElementById('progressFill');
  const counterCurrent = document.getElementById('counterCurrent');
  const counterTotal = document.getElementById('counterTotal');

  /* ------------------------------------------------------------------
     A. IMAGE DISCOVERY — tries images/image-1.jpg, image-1.jpeg, ...
        up through image-30, in parallel, with no code changes needed
        to add more images later; just drop the file in and it appears
        on the next auto-refresh.
     ------------------------------------------------------------------ */
  function probeUrl(url){
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
    });
  }

  async function probeIndex(i){
    for(const ext of EXTENSIONS){
      const url = `${FOLDER}${NAME_PREFIX}${i}.${ext}`;
      if(await probeUrl(url)) return url;
    }
    return null;
  }

  async function discoverImages(){
    const candidates = Array.from({ length: MAX_INDEX }, (_, i) => probeIndex(i + 1));
    const resolved = await Promise.all(candidates);
    return resolved.filter(Boolean);
  }

  /* ------------------------------------------------------------------
     B. SLIDESHOW — plain crossfade, fixed dwell time, loops forever
     ------------------------------------------------------------------ */
  let slideEls = [];
  let current = 0;
  let paused = false;
  let advanceTimer = null;

  function buildSlides(urls){
    urls.forEach((url, i) => {
      const el = document.createElement('div');
      el.className = 'slide';
      el.innerHTML = `<img src="${url}" alt="Crispr Learning slide ${i + 1}">`;
      stage.insertBefore(el, bottomChrome);
      slideEls.push(el);
    });
  }

  function setProgress(running){
    progressFill.classList.remove('running', 'done');
    void progressFill.offsetWidth; // restart the CSS animation cleanly
    progressFill.classList.add(running ? 'running' : 'done');
  }

  function goTo(index){
    const total = slideEls.length;
    const next = ((index % total) + total) % total;

    slideEls.forEach((el, i) => el.classList.toggle('is-active', i === next));

    current = next;
    counterCurrent.textContent = String(current + 1);
    setProgress(!paused);
    scheduleAdvance();
  }

  function scheduleAdvance(){
    clearTimeout(advanceTimer);
    if(paused) return;
    advanceTimer = setTimeout(() => goTo(current + 1), SLIDE_DURATION);
  }

  function pause(){
    if(paused) return;
    paused = true;
    clearTimeout(advanceTimer);
    progressFill.style.animationPlayState = 'paused';
  }

  function resume(){
    if(!paused) return;
    paused = false;
    progressFill.style.animationPlayState = 'running';
    scheduleAdvance();
  }

  async function start(){
    const urls = await discoverImages();

    if(urls.length === 0){
      noImagesEl.classList.add('visible');
      // keep checking — images may be added to the folder after boot
      setTimeout(start, 15000);
      return;
    }

    noImagesEl.classList.remove('visible');
    bottomChrome.hidden = false;
    counterTotal.textContent = String(urls.length);

    buildSlides(urls);
    slideEls[0].classList.add('is-active');
    setProgress(true);
    scheduleAdvance();
  }

  start();

  /* ------------------------------------------------------------------
     C. VISIBILITY HANDLING + KIOSK AUTO-REFRESH
     ------------------------------------------------------------------ */
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      clearTimeout(advanceTimer);
    } else if(!paused){
      scheduleAdvance();
    }
  });

  window.addEventListener('keydown', (e) => {
    if(slideEls.length === 0) return;
    switch(e.key){
      case 'ArrowRight': goTo(current + 1); break;
      case 'ArrowLeft': goTo(current - 1); break;
      case ' ': e.preventDefault(); paused ? resume() : pause(); break;
    }
  });

  // hard-reload from the network every 5 minutes (cache-busted) so newly
  // added images or an updated file reach the TV without manual restart.
  const AUTO_REFRESH_INTERVAL = 5 * 60 * 1000;
  setInterval(() => {
    const url = new URL(window.location.href);
    url.searchParams.set('_r', Date.now());
    window.location.replace(url.toString());
  }, AUTO_REFRESH_INTERVAL);

})();
</script>
</body>
</html>
